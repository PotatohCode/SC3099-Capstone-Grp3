# OpenTelemetry Collector: receives traces/metrics over OTLP from services
# that send them (OTEL_EXPORTER_OTLP_ENDPOINT in docker-compose.yml).
# The `logging` exporter was removed from current collector images, so this
# uses `debug`, and the Prometheus exporter moves to 8889 because the
# collector's own telemetry already listens on 8888.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024

exporters:
  debug:
    verbosity: basic
  prometheus:
    endpoint: "0.0.0.0:8889"

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
