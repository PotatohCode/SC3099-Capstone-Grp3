version: '3.8'

services:
  # ==========================================================================
  # Infrastructure Services
  # ==========================================================================

  postgres:
    image: postgres:15-alpine
    container_name: saiv-postgres
    environment:
      POSTGRES_USER: saiv
      POSTGRES_PASSWORD: saiv_password
      POSTGRES_DB: saiv
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saiv"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - saiv-network

  redis:
    image: redis:7-alpine
    container_name: saiv-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - saiv-network

  # ==========================================================================
  # Application Services (Students implement these)
  # ==========================================================================

  backend:
    build:
      context: ./module2-backend
      dockerfile: Dockerfile
    container_name: saiv-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://saiv:saiv_password@postgres:5432/saiv
      REDIS_URL: redis://redis:6379
      SECRET_KEY: your-secret-key-change-in-production
      FACE_SERVICE_URL: http://face-recognition:8001
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      # CORS_ORIGINS overrides app/core/config.py's Settings.CORS_ORIGINS default
      # (pydantic-settings reads this as a JSON list). The frontend normally calls the
      # API through the same-origin proxy below, so these only matter for direct calls.
      CORS_ORIGINS: '["http://localhost:3000","https://localhost:3443","http://${PUBLIC_HOST:-localhost}:3000","https://${PUBLIC_HOST:-localhost}:3443","http://localhost:8501"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Healthy = /health returns 200 (database reachable). start_period
    # covers the startup migrations (alembic upgrade head).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - saiv-network

  face-recognition:
    build:
      context: ./module3-face-recognition
      dockerfile: Dockerfile
    container_name: saiv-face-recognition
    ports:
      - "8001:8001"
    environment:
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - saiv-network

  frontend:
    build:
      context: ./module1-frontend
      dockerfile: Dockerfile
      args:
        # Baked into the client JS bundle at build time (Next.js NEXT_PUBLIC_* rule -
        # see module1-frontend/Dockerfile). "/" makes the app call /api/v1 on whatever
        # origin served the page; the frontend-proxy service routes /api/* to the backend.
        NEXT_PUBLIC_API_URL: /
        NEXT_PUBLIC_FACE_SERVICE_URL: http://${PUBLIC_HOST:-localhost}:8001
    container_name: saiv-frontend
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - saiv-network

  # Single entry point for the student PWA: http://localhost:3000 and
  # https://localhost:3443 or https://${PUBLIC_HOST}:3443 (self-signed; camera and
  # geolocation need HTTPS off localhost). Serves the frontend and proxies /api/* to the backend.
  frontend-proxy:
    image: caddy:2.8.4-alpine
    container_name: saiv-frontend-proxy
    ports:
      - "3000:3000"
      - "3443:3443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      HTTPS_SITES: https://localhost:3443${PUBLIC_HOST:+, https://${PUBLIC_HOST}:3443}
    volumes:
      - ./module1-frontend/deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - frontend
      - backend
    networks:
      - saiv-network

  dashboard:
    build:
      context: ./module4-observability
      dockerfile: Dockerfile
    container_name: saiv-dashboard
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgresql://saiv:saiv_password@postgres:5432/saiv
      BACKEND_URL: http://backend:8000
      PROMETHEUS_URL: http://prometheus:9090
      # Link opened in the user's browser, so it uses the host port.
      GRAFANA_PUBLIC_URL: http://${PUBLIC_HOST:-localhost}:3001
      # "true" adds an "Explore with sample data" button on the sign-in page.
      DEMO_MODE: "false"
    depends_on:
      backend:
        condition: service_healthy
      prometheus:
        condition: service_started
    networks:
      - saiv-network

  # ==========================================================================
  # Observability Services
  # ==========================================================================

  prometheus:
    # Pinned: ":latest" can change config formats without warning.
    image: prom/prometheus:v3.1.0
    container_name: saiv-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./module4-observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./module4-observability/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - saiv-network

  grafana:
    image: grafana/grafana:11.4.0
    container_name: saiv-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/json/attendance-security.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./module4-observability/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - saiv-network

  otel-collector:
    image: otel/opentelemetry-collector:0.160.0
    container_name: saiv-otel-collector
    ports:
      - "4317:4317"   # gRPC
      - "4318:4318"   # HTTP
    volumes:
      - ./module4-observability/otel-collector-config.yml:/etc/otel/config.yaml
    command: ["--config=/etc/otel/config.yaml"]
    networks:
      - saiv-network

networks:
  saiv-network:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  caddy_data:
